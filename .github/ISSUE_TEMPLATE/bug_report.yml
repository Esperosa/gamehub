name: Nahlášení chyby
description: Nahlásit reprodukovatelnou chybu v GameHubu.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Díky za nahlášení. Prosím vyplň všechna povinná pole.
  - type: input
    id: summary
    attributes:
      label: Shrnutí
      description: Co je rozbité?
      placeholder: Krátké shrnutí chyby
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Kroky reprodukce
      description: Přesná sekvence kroků pro reprodukci.
      placeholder: |
        1. Otevři ...
        2. Klikni ...
        3. Výsledek ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Očekávané chování
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Aktuální chování
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Verze
      description: Release tag nebo commit hash.
      placeholder: v0.6.1 / 872219d
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platforma
      description: OS + Python/runtime detaily.
      placeholder: Windows 11 / Python 3.12
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logy / screenshoty
      description: Přilož relevantní část `runtime.log` nebo screenshot.
