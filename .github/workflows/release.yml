name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Build Windows Artifacts
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1 -Version "${{ github.ref_name }}"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            dist/*_windows_x64.exe
            dist/*_windows_x64.zip
            dist/SHA256SUMS_windows.txt
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Build Linux Artifacts
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh "${{ github.ref_name }}"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: |
            dist/*_linux_x86_64
            dist/*_linux_x86_64.tar.gz
            dist/SHA256SUMS_linux.txt
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: artifacts/linux

      - name: Merge Checksums
        run: |
          cat artifacts/windows/SHA256SUMS_windows.txt > SHA256SUMS.txt
          cat artifacts/linux/SHA256SUMS_linux.txt >> SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*.exe
            artifacts/windows/*.zip
            artifacts/linux/*_linux_x86_64
            artifacts/linux/*.tar.gz
            SHA256SUMS.txt
