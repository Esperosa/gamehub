[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]
include = [
    "games/*/plugin.py",
    "hub/plugin_api.py",
    "hub/plugin_loader.py",
    "hub/solver_contract.py",
    "hub/layer_loader.py",
    "games/game2048/engine.py",
    "games/mastermind/engine.py",
    "games/othello/engine.py",
    "games/piskvorky/engine.py",
    "games/simon/engine.py",
    "games/sudoku/engine.py",
    "tests/test_generators_property.py",
    "tests/test_sudoku_engine.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
files = [
    "games/game2048/plugin.py",
    "hub/plugin_api.py",
    "hub/plugin_loader.py",
    "hub/solver_contract.py",
    "hub/layer_loader.py",
    "games/game2048/engine.py",
    "games/kenken/plugin.py",
    "games/mastermind/engine.py",
    "games/mastermind/plugin.py",
    "games/nonogram/plugin.py",
    "games/othello/engine.py",
    "games/othello/plugin.py",
    "games/piskvorky/engine.py",
    "games/piskvorky/plugin.py",
    "games/simon/engine.py",
    "games/simon/plugin.py",
    "games/slitherlink/plugin.py",
    "games/sudoku/engine.py",
    "games/sudoku/plugin.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
