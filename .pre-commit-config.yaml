repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        files: ^(hub/(plugin_api|solver_contract|layer_loader)\.py|games/(game2048|mastermind|othello|piskvorky|simon)/engine\.py|tests/test_generators_property\.py)$
      - id: ruff-format
        files: ^(hub/(plugin_api|solver_contract|layer_loader)\.py|games/(game2048|mastermind|othello|piskvorky|simon)/engine\.py|tests/test_generators_property\.py)$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]
        pass_filenames: false
